# Firebase App Hosting Configuration
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  minInstances: 0
  maxInstances: 10

# Root directory within the monorepo — Next.js app lives here
rootDir: apps/web

# Run the website with pnpm
runCommand: pnpm --filter website run start

# Environment variables (non-secret)
env:
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: betgenie-ai.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: betgenie-ai
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: betgenie-ai.appspot.com
  - variable: NEXT_PUBLIC_APP_NAME
    value: BetGenie
  - variable: NEXT_PUBLIC_APP_URL
    value: https://betgenie-ai.web.app

# Secrets from Google Secret Manager
# These are automatically injected at build and runtime
# To add secrets: gcloud secrets create SECRET_NAME --data-file=-
# Or use: firebase apphosting:secrets:set SECRET_NAME
