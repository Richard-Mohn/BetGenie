name: Deploy to Firebase App Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: betgenie-ai
  REGION: us-central1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci

      - name: Build website
        run: |
          cd apps/web
          npm run build

      - name: Setup Google Cloud SDK
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project ${{ env.PROJECT_ID }}

      - name: Deploy Cloud Functions
        run: |
          cd services/functions
          npm ci
          npm run build
          cd ../..
          firebase deploy --only functions --project ${{ env.PROJECT_ID }}

      - name: Deploy Firestore rules and indexes
        run: |
          firebase deploy --only firestore:rules,firestore:indexes --project ${{ env.PROJECT_ID }}

      - name: Deploy Storage rules
        run: |
          firebase deploy --only storage:rules --project ${{ env.PROJECT_ID }}

  deploy-cloud-run:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    
    strategy:
      matrix:
        service: [nba_data_ingestion, odds_aggregation, news_monitoring, ai_analysis]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Google Cloud SDK
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./cloud-services/${{ matrix.service }}
          push: true
          tags: gcr.io/${{ env.PROJECT_ID }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ matrix.service }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ matrix.service }}:latest \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 10 \
            --min-instances 0 \
            --set-env-vars GCP_PROJECT_ID=${{ env.PROJECT_ID }}
