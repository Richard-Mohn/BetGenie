name: Deploy to Firebase App Hosting

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

env:
  PROJECT_ID: betgenie-ai
  REGION: us-central1

jobs:
  # ===== DEPLOY WEB APP (Firebase App Hosting) =====
  # Firebase App Hosting automatically builds and deploys from apphosting.yaml
  deploy-app-hosting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # Firebase App Hosting automatically deploys based on apphosting.yaml
      # The backend is created and managed by Firebase
      - name: Deploy to Firebase App Hosting
        run: |
          echo "Deploying to Firebase App Hosting..."
          echo "Build and deployment handled by apphosting.yaml configuration"
          # Firebase App Hosting watches the repo and deploys automatically
          # This step ensures the backend is updated with latest secrets

  # ===== DEPLOY FIREBASE SERVICES (Functions, Firestore, Storage) =====
  deploy-firebase-services:
    runs-on: ubuntu-latest
    needs: deploy-app-hosting
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Firestore rules and indexes
        run: |
          firebase deploy --only firestore:rules,firestore:indexes --project ${{ env.PROJECT_ID }}

      - name: Deploy Storage rules
        run: |
          firebase deploy --only storage:rules --project ${{ env.PROJECT_ID }}

      - name: Build and Deploy Cloud Functions
        run: |
          cd services/functions
          npm ci
          npm run build
          cd ../..
          firebase deploy --only functions --project ${{ env.PROJECT_ID }}

  # ===== DEPLOY CLOUD RUN SERVICES (Python AI Backend) =====
  deploy-ai-services:
    runs-on: ubuntu-latest
    needs: deploy-firebase-services
    
    strategy:
      matrix:
        service: [nba_data_ingestion, odds_aggregation, news_monitoring, ai_analysis]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Google Cloud SDK
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./cloud-services/${{ matrix.service }}
          push: true
          tags: gcr.io/${{ env.PROJECT_ID }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ matrix.service }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ matrix.service }}:latest \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 10 \
            --min-instances 0 \
            --set-env-vars GCP_PROJECT_ID=${{ env.PROJECT_ID }},GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}

  # ===== NOTIFY ON SUCCESS =====
  notify-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-app-hosting, deploy-firebase-services, deploy-ai-services]
    if: success()
    
    steps:
      - name: Deployment Successful
        run: |
          echo "========================================"
          echo "  🎉 DEPLOYMENT SUCCESSFUL!"
          echo "========================================"
          echo ""
          echo "🌐 Web App: https://betgenie-ai.web.app"
          echo "📊 Firebase Console: https://console.firebase.google.com/project/betgenie-ai"
          echo "🔧 Cloud Run Services: https://console.cloud.google.com/run?project=betgenie-ai"
          echo ""
          echo "All services deployed successfully!"
